# Host nginx site for PACA on a shared droplet.
#
# PACA's stack listens only on 127.0.0.1:8090 (HTTP_BIND in .env.production);
# this server block gives it a public domain next to the droplet's other sites.
#
#   sudo cp deploy/nginx-paca.conf /etc/nginx/sites-available/paca
#   sudo sed -i 's/paca.example.com/YOUR.DOMAIN/' /etc/nginx/sites-available/paca
#   sudo ln -s /etc/nginx/sites-available/paca /etc/nginx/sites-enabled/paca
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN        # adds HTTPS + the 80 -> 443 redirect

server {
    listen 80;
    listen [::]:80;
    server_name paca.example.com;

    # Application documents are up to 8MB; leave headroom for multipart overhead.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
